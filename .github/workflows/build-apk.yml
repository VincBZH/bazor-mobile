name: Build BAZOR APK

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare rotated Android signing key
        shell: bash
        env:
          BAZOR_ANDROID_KEYSTORE_B64: ${{ secrets.BAZOR_ANDROID_KEYSTORE_B64 }}
          BAZOR_ANDROID_STORE_PASSWORD_SECRET: ${{ secrets.BAZOR_ANDROID_STORE_PASSWORD }}
          BAZOR_ANDROID_KEY_ALIAS_SECRET: ${{ secrets.BAZOR_ANDROID_KEY_ALIAS }}
          BAZOR_ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.BAZOR_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BAZOR_ANDROID_KEYSTORE_B64"
          test -n "$BAZOR_ANDROID_STORE_PASSWORD_SECRET"
          test -n "$BAZOR_ANDROID_KEY_ALIAS_SECRET"
          test -n "$BAZOR_ANDROID_KEY_PASSWORD_SECRET"
          SIGNING_FILE="$RUNNER_TEMP/bazor-android-release.jks"
          printf '%s' "$BAZOR_ANDROID_KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          chmod 600 "$SIGNING_FILE"
          {
            echo "BAZOR_ANDROID_KEYSTORE=$SIGNING_FILE"
            echo "BAZOR_ANDROID_STORE_PASSWORD=$BAZOR_ANDROID_STORE_PASSWORD_SECRET"
            echo "BAZOR_ANDROID_KEY_ALIAS=$BAZOR_ANDROID_KEY_ALIAS_SECRET"
            echo "BAZOR_ANDROID_KEY_PASSWORD=$BAZOR_ANDROID_KEY_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle :app:assembleDebug :watchapp:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../BAZOR-Tool.apk
          cp watchapp/build/outputs/apk/debug/watchapp-debug.apk ../BAZOR-Montre.apk

      - name: Upload BAZOR Tool
        uses: actions/upload-artifact@v4
        with:
          name: BAZOR-Tool-APK
          path: BAZOR-Tool.apk
          if-no-files-found: error

      - name: Upload BAZOR Montre
        uses: actions/upload-artifact@v4
        with:
          name: BAZOR-Montre-APK
          path: BAZOR-Montre.apk
          if-no-files-found: error

      - name: Publier la derniere APK pour la MAJ GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' watchapp/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' watchapp/build.gradle | head -1)
          mkdir -p ../downloads
          cp ../BAZOR-Montre.apk ../downloads/BAZOR-Montre.apk
          cat > ../watch-update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://raw.githubusercontent.com/VincBZH/bazor-mobile/main/downloads/BAZOR-Montre.apk",
            "notes": "Version stable publiee automatiquement depuis GitHub"
          }
          EOF
          cd ..
          git config user.name "BAZOR GitHub Update"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/BAZOR-Montre.apk watch-update.json
          git diff --cached --quiet && exit 0
          git commit -m "Publie BAZOR Montre v${VERSION_NAME} [skip ci]"
          git push
