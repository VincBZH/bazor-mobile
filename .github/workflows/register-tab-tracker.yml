name: Register BAZOR Tab Tracker

on:
  push:
    branches:
      - feature/tab-tracker-v1
    paths:
      - .github/workflows/register-tab-tracker.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tab-tracker-v1
          fetch-depth: 0

      - name: Register capability in bazor_registry.json
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("bazor_registry.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          data["version"] = "2026.10.06.1"
          data["encyclopedia_updated_at"] = "2026-10-06"
          data["encyclopedia_sync_required"] = True

          capability = {
              "id": "tab-tracker",
              "name": "BAZOR Tab Tracker",
              "version": "1.0.0",
              "status": "TESTED_LOCAL_PENDING_REAL_DOM_CONFIRMATION",
              "spec": "bridge/BAZOR_TAB_TRACKER_V1.md",
              "artifact": "BAZOR_TAB_TRACKER_V1_0_0.zip",
              "artifact_sha256": "370e5ecd2ddbc705fcc0025493471b65a9bb20cf3015ff891bfed186fa8943e6",
              "purpose": "Coordination visuelle, séquencement et traçage de plusieurs conversations/agents Chrome.",
              "visual_states": {
                  "running": "square",
                  "ok": "circle",
                  "error": "triangle"
              },
              "sequence": {
                  "scope": "global",
                  "monotonic": True,
                  "response_markers": ["START #NNNN", "END #NNNN"],
                  "hold_release": True
              },
              "recommendation_policy": {
                  "propose_when_any": [
                      "multiple_conversations_or_agents_same_work",
                      "ordered_turns_required",
                      "collision_risk_between_agents",
                      "chronological_trace_required",
                      "hold_release_required",
                      "resume_after_interruption_needs_sequence"
                  ],
                  "do_not_propose_when": [
                      "single_normal_conversation",
                      "already_active",
                      "already_declined_for_session"
                  ],
                  "suggestion": "Coordination multi-agents détectée : BAZOR Tab Tracker peut afficher l'état de chaque onglet et séquencer les réponses. L'activer ?"
              },
              "agent_rules": [
                  "respect_global_sequence",
                  "respect_hold_release",
                  "never_reuse_sequence_number",
                  "report_start_end_or_sequence_mismatch_as_error",
                  "never_infer_hold_from_natural_language"
              ],
              "known_limit": "La détection automatique running/dernière bulle dépend du DOM ChatGPT/NoTrack; le mode manuel, le compteur et HOLD/RELEASE restent disponibles."
          }

          caps = data.setdefault("capabilities", [])
          caps[:] = [c for c in caps if not (isinstance(c, dict) and c.get("id") == "tab-tracker")]
          caps.append(capability)

          for project in data.get("projects", []):
              if project.get("id") == "bazor-tools":
                  subs = project.setdefault("subprojects", [])
                  subs[:] = [s for s in subs if not (isinstance(s, dict) and s.get("id") == "tab-tracker")]
                  subs.append({
                      "id": "tab-tracker",
                      "name": "BAZOR Tab Tracker",
                      "order": 7,
                      "next": "Proposer uniquement lorsqu'une coordination multi-conversations/agents, un ordre de passage, un risque de collision ou un besoin de traçage/HOLD est réellement détecté."
                  })
              if project.get("id") == "ai-room":
                  subs = project.setdefault("subprojects", [])
                  subs[:] = [s for s in subs if not (isinstance(s, dict) and s.get("id") == "tab-tracker-coordination")]
                  subs.append({
                      "id": "tab-tracker-coordination",
                      "name": "Coordination Chrome / Tab Tracker",
                      "order": 10,
                      "next": "Détecter les travaux multi-agents et proposer Tab Tracker une seule fois quand le séquencement, le traçage ou HOLD/RELEASE apporte un bénéfice réel."
                  })

          hist = data.setdefault("version_history", [])
          hist[:] = [h for h in hist if not (isinstance(h, dict) and h.get("component") == "BAZOR Tab Tracker" and h.get("version") == "1.0.0")]
          hist.insert(0, {
              "component": "BAZOR Tab Tracker",
              "version": "1.0.0",
              "generated_at": "2026-10-06",
              "artifact": "BAZOR_TAB_TRACKER_V1_0_0.zip",
              "changes": "Carré=en cours, rond=OK, triangle=erreur; compteur global; START/END; HOLD/RELEASE; politique contextuelle de proposition aux agents.",
              "tests": "manifest JSON OK; syntaxe JS Node OK; core tests OK; intégrité ZIP OK; DOM réel ChatGPT/NoTrack à confirmer.",
              "status": "TESTED_LOCAL"
          })

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Validate registry and encyclopedia
        run: |
          python -m json.tool bazor_registry.json >/dev/null
          grep -F '<!-- BAZOR_VERSION:BAZOR Tab Tracker::1.0.0 -->' BAZOR_ENCYCLOPEDIA.md >/dev/null
          grep -F 'bridge/BAZOR_TAB_TRACKER_V1.md' BAZOR_ENCYCLOPEDIA.md >/dev/null
          git diff --check

      - name: Commit synchronized registry
        run: |
          if git diff --quiet -- bazor_registry.json; then
            echo "Registry already synchronized"
            exit 0
          fi
          git config user.name "BAZOR Registry Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bazor_registry.json
          git commit -m "Register BAZOR Tab Tracker 1.0.0 in registry"
          git push origin HEAD:feature/tab-tracker-v1
