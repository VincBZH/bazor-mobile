name: BAZOR Console Hub CI

on:
  push:
    paths:
      - "console-hub/**"
      - "pc-relay/bazor_security.py"
      - "pc-relay/bazor_pc_relay_v3.py"
      - "pc-relay/bazor_github_watcher.py"
      - "pc-relay/bazor_action_engine.py"
      - "bazor_registry.json"
      - "index.html"
      - ".github/workflows/bazor-console-hub-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: |
          python -m py_compile \
            console-hub/bazor_console_hub.py \
            console-hub/bazor_hub_expert_review.py \
            console-hub/bazor_popup_guard.py \
            console-hub/bazor_interface_update_restart.py \
            console-hub/bazor_minimax_h3_repair.py \
            pc-relay/bazor_security.py \
            pc-relay/bazor_pc_relay_v3.py \
            pc-relay/bazor_github_watcher.py \
            pc-relay/bazor_action_engine.py \
            pc-relay/mammouth_client.py
      - name: Validate mobile UI JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
          assert scripts, "mobile script missing"
          Path("/tmp/bazor-mobile.js").write_text("\n".join(scripts),encoding="utf-8")
          assert "projectGoCompatible" in html, "GO compatibility guard missing"
          assert 'status:"INCOMPATIBLE"' in html, "incompatible GO result missing"
          print("Mobile UI extraction OK")
          PY
          node --check /tmp/bazor-mobile.js
      - name: Validate central registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("bazor_registry.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(data.get("projects"), list) and data["projects"], "projects missing"
          ids=[x["id"] for x in data["projects"]]
          assert len(ids)==len(set(ids)), "duplicate project ids"
          for proj in data["projects"]:
              subs=[x["id"] for x in proj.get("subprojects",[])]
              assert len(subs)==len(set(subs)), f"duplicate subproject ids in {proj['id']}"
          assert any(p["id"]=="bazor-security" for p in data["projects"])
          print("Registry OK:",len(data["projects"]),"projects")
          PY
      - name: Security invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          sec=Path("pc-relay/bazor_security.py").read_text(encoding="utf-8")
          hub=Path("console-hub/bazor_console_hub.py").read_text(encoding="utf-8")
          assert "self._pair_hash" in sec, "pairing hash persistence missing"
          assert "secret" in sec and "device-proof" in sec, "device proof missing"
          assert "SERVICES = [" in hub, "managed service allow-list missing"
          assert 'if not svc.get("managed")' in hub, "external process close guard missing"
          print("Security invariants OK")
          PY
      - name: Mammouth task profile regression
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path("pc-relay/bazor_pc_relay_v3.py").read_text(encoding="utf-8")
          watcher=Path("pc-relay/bazor_github_watcher.py").read_text(encoding="utf-8")
          assert "mammouth_profile=None" in core
          assert 'body.get("mammouth_profile")' in core
          assert "requested_profile in mammouth_client.MODEL_PROFILES" in core
          assert "[bazor-mammouth" in watcher
          assert "core_mammouth_task" in watcher
          assert '"provider":"mammouth"' in watcher
          assert '"apply_actions":bool(meta["apply_actions"])' in watcher
          print("Mammouth profile queue regression OK")
          PY
      - name: Mobile task async regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          src=Path("pc-relay/bazor_pc_relay_v3.py").read_text(encoding="utf-8")
          tree=ast.parse(src)

          # Régression 2026-09-18 : request_id était présent dans kwargs ET
          # passé positionnellement à start_mobile_task, ce qui levait
          # TypeError et faisait répondre le Gateway en 502.
          assert '"request_id": body.get("request_id")' not in src
          assert 'worker_kwargs["request_id"] = rid' in src
          assert 'result = start_mobile_task(request_id, **kwargs)' in src
          print("Mobile task async regression OK")
          PY
      - name: Action Engine smoke test
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, "pc-relay")
          from bazor_action_engine import ActionEngine

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              p=root/"demo.py"
              p.write_text("x = 1\n",encoding="utf-8")
              eng=ActionEngine(root/"data")
              eng.roots={"test":root}
              eng.project_aliases={"demo":["test"]}
              answer='''STATUS: OK
          PROGRESS: 50
          SUMMARY: modif
          NEXT: suite
          BAZOR_ACTIONS:
          {"actions":[{"op":"replace","root":"test","path":"demo.py","find":"x = 1","replace":"x = 2","expected_count":1}]}'''
              actions=eng.parse_actions(answer)
              assert len(actions)==1, actions
              result=eng.apply("demo",actions,"ci")
              assert result["ok"] and result["applied"], result
              assert p.read_text(encoding="utf-8")=="x = 2\n"
              assert all(t["ok"] for t in result["tests"]), result
              print("Action Engine OK")
          PY
