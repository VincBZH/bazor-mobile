name: BAZOR Console Hub CI

on:
  push:
    paths:
      - "console-hub/**"
      - "pc-relay/bazor_security.py"
      - "pc-relay/bazor_pc_relay_v3.py"
      - "pc-relay/bazor_github_watcher.py"
      - "pc-relay/bazor_action_engine.py"
      - "pc-relay/bazor_studio_qualifier.py"
      - "bazor_registry.json"
      - "index.html"
      - "BAZOR_ENCYCLOPEDIA.md"
      - "LANCER_BAZOR_STUDIO_CERTIFIE.cmd"
      - ".github/workflows/bazor-console-hub-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: |
          python -m py_compile \
            console-hub/bazor_console_hub.py \
            console-hub/bazor_hub_expert_review.py \
            console-hub/bazor_popup_guard.py \
            console-hub/bazor_interface_update_restart.py \
            console-hub/bazor_minimax_h3_repair.py \
            console-hub/bazor_studio_certified_launcher.py \
            pc-relay/bazor_security.py \
            pc-relay/bazor_pc_relay_v3.py \
            pc-relay/bazor_github_watcher.py \
            pc-relay/bazor_action_engine.py \
            pc-relay/mammouth_client.py
      - name: Validate mobile UI JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
          assert scripts, "mobile script missing"
          Path("/tmp/bazor-mobile.js").write_text("\n".join(scripts),encoding="utf-8")
          assert "projectGoCompatible" in html, "GO compatibility guard missing"
          assert 'status:"INCOMPATIBLE"' in html, "incompatible GO result missing"
          assert "function goTask(" in html, "dynamic task executor missing"
          assert "taskStates" in html and "TÂCHES DYNAMIQUES" in html, "dynamic task board missing"
          assert "SECONDE LECTURE MAMMOUTH" in html, "Mammouth review stage missing"
          print("Mobile UI extraction OK")
          PY
          node --check /tmp/bazor-mobile.js
      - name: Validate central registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("bazor_registry.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(data.get("projects"), list) and data["projects"], "projects missing"
          ids=[x["id"] for x in data["projects"]]
          assert len(ids)==len(set(ids)), "duplicate project ids"
          for proj in data["projects"]:
              subs=[x["id"] for x in proj.get("subprojects",[])]
              assert len(subs)==len(set(subs)), f"duplicate subproject ids in {proj['id']}"
              tasks=proj.get("tasks",[])
              tids=[x["id"] for x in tasks]
              assert len(tids)==len(set(tids)), f"duplicate task ids in {proj['id']}"
              known=set(tids)
              for task in tasks:
                  assert task.get("priority") in ("P0","P1","P2"), f"bad priority {task.get('id')}"
                  assert task.get("action"), f"missing action {task.get('id')}"
                  assert task.get("acceptance"), f"missing acceptance {task.get('id')}"
                  assert task.get("proof_required"), f"missing proof rule {task.get('id')}"
                  missing=[x for x in task.get("dependencies",[]) if x not in known]
                  assert not missing, f"unknown dependencies {task.get('id')}: {missing}"
          assert any(p["id"]=="bazor-security" for p in data["projects"])
          studio=next(p for p in data["projects"] if p["id"]=="simple-studio")
          assert len(studio.get("tasks",[])) >= 10, "Studio task board too small"
          assert any(t["id"]=="STUDIO-P0-003" for t in studio["tasks"]), "H3 critical task missing"
          assert data.get("knowledge_base")=="BAZOR_ENCYCLOPEDIA.md", "knowledge base link missing"
          assert Path("BAZOR_ENCYCLOPEDIA.md").exists(), "encyclopedia missing"
          print("Registry OK:",len(data["projects"]),"projects,",len(studio["tasks"]),"Studio tasks")
          PY
      - name: Security invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          sec=Path("pc-relay/bazor_security.py").read_text(encoding="utf-8")
          hub=Path("console-hub/bazor_console_hub.py").read_text(encoding="utf-8")
          assert "self._pair_hash" in sec, "pairing hash persistence missing"
          assert "secret" in sec and "device-proof" in sec, "device proof missing"
          assert "SERVICES = [" in hub, "managed service allow-list missing"
          assert 'if not svc.get("managed")' in hub, "external process close guard missing"
          print("Security invariants OK")
          PY
      - name: Mammouth multi-JSON parser regression
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("mammouth_client","pc-relay/mammouth_client.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          sample='{"meta":"x"}\n{"choices":[{"message":{"content":"OK"}}],"model":"qwen3.8-flash"}'
          d=m._parse_api_json(sample)
          assert d["choices"][0]["message"]["content"]=="OK"
          print("Mammouth multi-JSON parser OK")
          PY
      - name: Predefined task queue safety regression
        run: |
          python - <<'PY'
          from pathlib import Path
          watcher=Path("pc-relay/bazor_github_watcher.py").read_text(encoding="utf-8")
          assert "[bazor-task:" in watcher
          assert "def _registry_task(" in watcher
          assert "unknown_registry_task" in watcher
          assert '"provider":"auto","apply_actions":True' in watcher
          assert "ACTION_SANDBOX" in Path("pc-relay/bazor_action_engine.py").read_text(encoding="utf-8")
          # La file distante ne prend qu'un ID du registre; le corps de l'issue
          # ne devient ni commande shell ni texte de modification arbitraire.
          task_loop=watcher[watcher.index('if title.startswith("[bazor-task:")'):]
          assert "_run_registry_task(task_id)" in task_loop
          assert "issue.get(\"body\")" not in task_loop.split('if title.startswith("[bazor-mammouth")')[0]
          print("Predefined task queue safety OK")
          PY
      - name: Mammouth task profile regression
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path("pc-relay/bazor_pc_relay_v3.py").read_text(encoding="utf-8")
          watcher=Path("pc-relay/bazor_github_watcher.py").read_text(encoding="utf-8")
          assert "mammouth_profile=None" in core
          assert 'body.get("mammouth_profile")' in core
          assert "requested_profile in mammouth_client.MODEL_PROFILES" in core
          assert "[bazor-mammouth" in watcher
          assert "core_mammouth_task" in watcher
          assert '"provider":"mammouth"' in watcher
          assert '"apply_actions":bool(meta["apply_actions"])' in watcher
          assert "ThreadPoolExecutor" in watcher, "Mammouth reviews are not parallel"
          client=Path("pc-relay/mammouth_client.py").read_text(encoding="utf-8")
          assert "_USAGE_LOCK" in client, "parallel usage accounting lock missing"
          assert 'explicit_provider == "mammouth"' in core, "explicit Mammouth fallback guard missing"
          assert 'generic_refusal_no_local_fallback' in core, "Mammouth must not silently fall back to Ollama"
          print("Mammouth profile queue regression OK")
          PY
      - name: Mobile task async regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          src=Path("pc-relay/bazor_pc_relay_v3.py").read_text(encoding="utf-8")
          tree=ast.parse(src)

          # Régression 2026-09-18 : request_id était présent dans kwargs ET
          # passé positionnellement à start_mobile_task, ce qui levait
          # TypeError et faisait répondre le Gateway en 502.
          assert '"request_id": body.get("request_id")' not in src
          assert 'worker_kwargs["request_id"] = rid' in src
          assert 'result = start_mobile_task(request_id, **kwargs)' in src
          print("Mobile task async regression OK")
          PY
      - name: Studio qualifier selftest
        run: |
          python pc-relay/bazor_studio_qualifier.py --selftest
          python - <<'PY'
          from pathlib import Path
          watcher=Path("pc-relay/bazor_github_watcher.py").read_text(encoding="utf-8")
          assert "[bazor-qualify:studio]" in watcher
          assert "_run_studio_qualification" in watcher
          assert "QUALIFY_MARK" in watcher
          print("Studio qualifier watcher integration OK")
          PY
      - name: Studio certified launcher selftest
        run: |
          python console-hub/bazor_studio_certified_launcher.py --selftest
          python - <<'PY'
          from pathlib import Path
          launcher=Path("console-hub/bazor_studio_certified_launcher.py").read_text(encoding="utf-8")
          cmd=Path("LANCER_BAZOR_STUDIO_CERTIFIE.cmd").read_text(encoding="utf-8")
          watcher=Path("pc-relay/bazor_github_watcher.py").read_text(encoding="utf-8")
          assert "qualification_cached_ok" in launcher
          assert "runtime_gate" in launcher
          assert "--test-only" in launcher
          assert "8188" in launcher and "8191" in launcher
          assert "LANCER_BAZOR_STUDIO.cmd" in launcher
          assert "bazor_studio_certified_launcher.py" in cmd
          assert "bazor_pc_relay_v3" in cmd
          assert "pause" in cmd.lower(), "CMD must stay open on failure"
          assert "BAZOR_STUDIO_NO_PAUSE" in cmd, "automated no-pause gate missing"
          assert "^|" not in cmd, "CMD must not leak caret-pipe into PowerShell"
          assert "foreach($cand in $cands)" in cmd, "safe Python candidate loop missing"
          assert "BAZOR_STUDIO_TEST_ONLY" in launcher, "safe env test gate missing"
          assert "[bazor-certify:studio]" in watcher
          assert "_run_studio_certified_test" in watcher
          assert '["cmd","/c",cmd]' in watcher, "watcher must test the real CMD"
          assert 'env["BAZOR_STUDIO_TEST_ONLY"]="1"' in watcher
          assert 'env["BAZOR_STUDIO_NO_PAUSE"]="1"' in watcher
          print("Studio certified launcher integration OK")
          PY
      - name: Action Engine smoke test
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, "pc-relay")
          from bazor_action_engine import ActionEngine

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              p=root/"demo.py"
              p.write_text("x = 1\n",encoding="utf-8")
              eng=ActionEngine(root/"data")
              eng.roots={"test":root}
              eng.project_aliases={"demo":["test"]}
              answer='''STATUS: OK
          PROGRESS: 50
          SUMMARY: modif
          NEXT: suite
          BAZOR_ACTIONS:
          {"actions":[{"op":"replace","root":"test","path":"demo.py","find":"x = 1","replace":"x = 2","expected_count":1}]}'''
              actions=eng.parse_actions(answer)
              assert len(actions)==1, actions
              result=eng.apply("demo",actions,"ci")
              assert result["ok"] and result["applied"], result
              assert result["preflight"] and result["preflight"]["ok"], result
              assert Path(result["preflight"]["sandbox_dir"]).exists(), result
              assert all(t["ok"] for t in result["preflight"]["tests"]), result
              if result["preflight"]["git"]["available"]:
                  assert result["preflight"]["git"]["baseline"], result
                  assert result["preflight"]["git"]["diff_check"] is True, result
              assert p.read_text(encoding="utf-8")=="x = 2\n"
              assert all(t["ok"] for t in result["tests"]), result

              # Régression Windows : CRLF ne doit pas être rejeté comme trailing whitespace.
              crlf=root/"crlf.py"
              crlf.write_bytes(b"y = 1\r\n")
              result_crlf=eng.apply("demo",[{"op":"replace","root":"test","path":"crlf.py","find":"y = 1","replace":"y = 2","expected_count":1}],"ci-crlf")
              assert result_crlf["ok"] and result_crlf["applied"], result_crlf
              assert result_crlf["preflight"]["ok"], result_crlf
              assert crlf.read_bytes()==b"y = 2\r\n", crlf.read_bytes()

              # Une candidate invalide doit échouer AVANT d'écrire dans la cible.
              bad=[{"op":"replace","root":"test","path":"demo.py","find":"x = 2","replace":"def broken(:\n","expected_count":1}]
              failed=eng.apply("demo",bad,"ci-bad")
              assert not failed["ok"] and failed["error"]=="preflight_failed", failed
              assert p.read_text(encoding="utf-8")=="x = 2\n", "target changed despite preflight failure"

              # Le contexte doit prioriser les fichiers dont le nom correspond
              # à la tâche, au lieu de prendre seulement les plus récents.
              (root/"unrelated_recent.py").write_text("print('recent')\n",encoding="utf-8")
              time_target=root/"MiniMax_H3_workflow.json"
              time_target.write_text('{"clip_name":"qwen3vl_4b_int8_convrot.safetensors"}\n',encoding="utf-8")
              ctx,report=eng.context_for_project("demo",max_files=1,focus="MiniMax H3 workflow clip_name")
              assert report["files"] and report["files"][0]["path"]=="MiniMax_H3_workflow.json", report
              print("Action Engine sandbox + target protection + focused context OK")
          PY
