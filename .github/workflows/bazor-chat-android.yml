name: BAZOR CHAT Android

on:
  push:
    branches: ["feature/bazor-chat-android-v1"]
    paths:
      - "android/bazor-chat/**"
      - ".github/workflows/bazor-chat-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and native build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Fetch pinned llama.cpp source
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git android/llama.cpp
          git -C android/llama.cpp checkout 6050b467c07a95c7b87debd4ddac2f8ba8d9b807
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Run unit tests and assemble debug APK
        working-directory: android/bazor-chat
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify and fingerprint APK
        run: |
          set -euo pipefail
          APK="android/bazor-chat/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/BAZOR_CHAT_ANDROID_V1.0.0.apk
          sha256sum dist/BAZOR_CHAT_ANDROID_V1.0.0.apk | tee dist/SHA256SUMS.txt
          file dist/BAZOR_CHAT_ANDROID_V1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BAZOR_CHAT_ANDROID_V1.0.0
          path: |
            dist/BAZOR_CHAT_ANDROID_V1.0.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
