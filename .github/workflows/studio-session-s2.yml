name: Studio Session S2 verification
on:
  push:
    branches: ['handoff/studio-session-s2-20260920']
    paths: ['studio-deliverables/session-s2/**', '.github/workflows/studio-session-s2.yml']
  pull_request:
    paths: ['studio-deliverables/session-s2/**', '.github/workflows/studio-session-s2.yml']
permissions:
  contents: read
jobs:
  python-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archive integrity and extract
        working-directory: studio-deliverables/session-s2
        run: |
          sha256sum --check SHA256SUMS
          python -m zipfile -e BAZOR_STUDIO_SESSION_S2_SOURCES.zip tested
      - run: python -m pip install aiohttp==3.12.15 Pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Targeted Python and regression suites
        working-directory: studio-deliverables/session-s2/tested
        run: |
          python fix/test_session_s2.py
          python -m unittest discover -s work/studio/tests -p test_studio.py
          python work/studio/app/check_startup.py
          node fix/test_frontend.cjs
          node --check work/studio/app/static/app.js
  windows-stop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parser and isolated stop scenarios
        shell: powershell
        run: |
          & studio-deliverables/session-s2/fix/test_windows_stop.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
