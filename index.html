<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>BAZOR COMMAND CENTER</title><style>
:root{--bg:#15171c;--panel:#20232a;--panel2:#292d36;--text:#f5f7fa;--muted:#aab1bd;--accent:#29a8ff;--ok:#45d483;--warn:#f2c94c;--bad:#ff6b6b;--line:#383d48}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding-bottom:90px}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#332713,#15171c 72%);border-bottom:1px solid var(--line);padding:14px 16px}.brand{font-weight:900;letter-spacing:.04em}.sub{font-size:12px;color:var(--muted);margin-top:4px}main{max-width:760px;margin:auto;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.ok{background:#173d2b;color:var(--ok)}.todo{background:#403718;color:var(--warn)}.blocked{background:#472226;color:var(--bad)}button,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 14px;font-weight:800}.primary{background:var(--accent);color:#21190b}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#4a2328;color:#ffd3d3}.wide{width:100%}textarea,select{width:100%;background:#17191e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:120px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.progress{height:9px;background:#111318;border-radius:999px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--accent)}nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#121419ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}nav .tabs{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}nav button{background:transparent;color:var(--muted);padding:9px 4px;font-size:11px}nav button.active{background:var(--panel2);color:var(--accent)}h2,h3{margin:0 0 8px}h2{font-size:19px}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:12px 0}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#101216;color:#fff;padding:11px 14px;border-radius:12px;border:1px solid var(--line);z-index:20;display:none;max-width:90%}
</style></head><body><header><div class="row"><div><div class="brand">BAZOR COMMAND CENTER</div><div class="sub">Mobile • BAZOR Core • Ollama</div></div><span id="pcStatus" class="badge todo">CONNEXION…</span></div></header><main><section id="home"></section><section id="capture" class="hidden"><div class="card"><h2>BAZOR CAPTURE</h2><div class="muted small">Transforme une idée rapide en tâche.</div><label>Note</label><textarea id="captureText" placeholder="Ex. Ajouter une fonction dans AI Room…"></textarea><div class="row wrap"><button class="secondary grow" id="micBtn">🎙️ Dicter</button><button class="secondary grow" id="clearCapture">Effacer</button></div><label>Projet</label><select id="captureProject"></select><label>Priorité</label><select id="capturePriority"><option>NORMALE</option><option>BASSE</option><option>HAUTE</option><option>URGENTE</option></select><div style="height:10px"></div><button class="primary wide" id="saveCapture">ENVOYER DANS L'INBOX</button></div></section><section id="inbox" class="hidden"></section><section id="ollama" class="hidden"></section><section id="journal" class="hidden"></section></main><div class="toast" id="toast"></div><nav><div class="tabs"><button data-tab="home" class="active">⌂<br>Accueil</button><button data-tab="capture">✎<br>Capture</button><button data-tab="inbox">☰<br>Inbox</button><button data-tab="ollama">◉<br>Ollama</button><button data-tab="journal">≡<br>Journal</button></div></nav><script>
const CORE_PORT=8775;let CORE=null;async function detectCore(){const hosts=[location.hostname,"127.0.0.1"];for(const h of hosts){if(!h||h==="github.com")continue;try{const base="http://"+h+":"+CORE_PORT;const r=await fetch(base+"/api/v1/health",{cache:"no-store"});if(r.ok){const d=await r.json();CORE=base;pcStatus.textContent=d.ollama?.online?"PC + OLLAMA OK":"PC OK / OLLAMA HS";pcStatus.className="badge "+(d.ollama?.online?"ok":"todo");return d}}catch(e){}}pcStatus.textContent="PC NON JOIGNABLE";pcStatus.className="badge blocked";return null}async function coreChat(text,target="ollama"){if(!CORE)await detectCore();if(!CORE)throw new Error("core_unreachable");const r=await fetch(CORE+"/api/v1/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,target,room:"BAZOR MOBILE"})});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}const KEY="bazor.command.center.mobile.v1",uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const seed={projects:[{id:"ai-room",name:"BAZOR AI Room",status:"A_FAIRE",progress:62,next:"Brancher l'historique des sessions"},{id:"simple-studio",name:"AI Simple Studio",status:"OK",progress:88,next:"Relire les presets de génération"},{id:"wii-relay",name:"Projet Wii AI Relay",status:"BLOQUE",progress:34,next:"Tester le pont quand le PC est disponible"},{id:"modo-viewer",name:"MODO Viewer",status:"A_FAIRE",progress:45,next:"Corriger le zoom tactile"}],inbox:[],jobs:[{id:"j1",label:"Résumer les notes AI Room",model:"mistral:latest",status:"EN ATTENTE"},{id:"j2",label:"Analyser les logs Wii",model:"qwen2.5-coder:7b",status:"PC HORS LIGNE"}],journal:[{id:"l1",what:"Initialisation BAZOR Mobile",tag:"OK",when:Date.now(),who:"BAZOR"}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){state=structuredClone(seed)}const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1700)}function log(what,tag="OK"){state.journal.unshift({id:uid(),what,tag,when:Date.now(),who:"Vincent"})}function pname(id){return state.projects.find(p=>p.id===id)?.name||"Général"}function scl(s){return s==="OK"?"ok":s==="A_FAIRE"?"todo":"blocked"}function renderHome(){home.innerHTML='<div class="card"><h2>Vue d\'ensemble</h2><div class="small muted">Les actions PC restent simulées tant que le relais n\'est pas connecté.</div></div>'+state.projects.map(p=>'<div class="card"><div class="row"><h2>'+esc(p.name)+'</h2><span class="badge '+scl(p.status)+'">'+(p.status==="A_FAIRE"?"À FAIRE":p.status)+'</span></div><div class="progress"><div style="width:'+p.progress+'%"></div></div><div class="small muted">Progression '+p.progress+'%</div><hr><div class="small muted">PROCHAINE ACTION</div><div style="margin:5px 0 12px">'+esc(p.next)+'</div><div class="row"><button class="primary grow" onclick="goProject(\''+p.id+'\')">GO</button><button class="secondary grow" onclick="goAuto(\''+p.id+'\')">GO AUTO</button></div></div>').join("")}async function goProject(id){let p=state.projects.find(x=>x.id===id);toast("Envoi à BAZOR…");try{let r=await coreChat("Projet: "+p.name+"\nAction: "+p.next,"ollama");log("GO exécuté — "+p.name);save();toast(r?.ollama?"Ollama a répondu ✓":"BAZOR a traité ✓")}catch(e){log("GO en attente relais — "+p.name,"BLOQUÉ");save();toast("PC non joignable — conserver dans Inbox")}}async function goAuto(id){let p=state.projects.find(x=>x.id===id);if(!CORE)await detectCore();if(!CORE){state.inbox.unshift({id:uid(),project:id,type:"GO AUTO",title:p.next,priority:"HAUTE",status:"À TRAITER",created:Date.now()});log("GO AUTO mis en attente — "+p.name,"BLOQUÉ");save();toast("PC absent : tâche conservée");return}try{const r=await fetch(CORE+"/api/v1/go",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project_id:id,task:p.next,room:"BAZOR MOBILE",files:[]})});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();log("GO AUTO exécuté — "+p.name);save();toast(d.ok?"GO AUTO terminé ✓":"GO AUTO retourné")}catch(e){log("GO AUTO bloqué — "+p.name,"BLOQUÉ");save();toast("Blocage GO AUTO — journalisé")}}function fillProjects(){captureProject.innerHTML='<option value="">Automatique / Général</option>'+state.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")}function renderInbox(){inbox.innerHTML='<div class="card"><h2>INBOX</h2><div class="small muted">'+state.inbox.filter(x=>x.status==="À TRAITER").length+' à traiter</div></div>'+state.inbox.map(i=>'<div class="card"><span class="badge todo">'+esc(i.type)+'</span><h3 style="margin-top:10px">'+esc(i.title)+'</h3><div class="small muted">'+esc(pname(i.project))+' • '+esc(i.priority)+' • '+esc(i.status)+'</div><div class="row" style="margin-top:12px"><button class="secondary grow" onclick="treat(\''+i.id+'\')">Traiter</button><button class="danger" onclick="delInbox(\''+i.id+'\')">Suppr.</button></div></div>').join("")}function treat(id){let i=state.inbox.find(x=>x.id===id);i.status="TRAITÉ";log("Inbox traitée — "+i.title);save();toast("Marqué traité")}function delInbox(id){let i=state.inbox.find(x=>x.id===id);if(confirm("Supprimer cet élément ?")){state.inbox=state.inbox.filter(x=>x.id!==id);log("Inbox supprimée — "+i.title,"AMÉLIORATION");save()}}function renderOllama(){ollama.innerHTML='<div class="card"><h2>OLLAMA</h2><div class="small muted">Aucun port Ollama exposé. V1 simulée.</div></div>'+state.jobs.map(j=>'<div class="card"><div class="row"><h3>'+esc(j.label)+'</h3><span class="badge '+(j.status==="PC HORS LIGNE"?"blocked":"todo")+'">'+esc(j.status)+'</span></div><div class="small muted">'+esc(j.model)+' • SIMULATION</div></div>').join("")}function renderJournal(){journal.innerHTML='<div class="card"><h2>JOURNAL</h2><div class="small muted">Traçabilité locale</div></div>'+state.journal.map(j=>'<div class="card"><div class="row"><strong>'+esc(j.what)+'</strong><span class="badge '+(j.tag==="OK"?"ok":j.tag==="BLOQUÉ"?"blocked":"todo")+'">'+esc(j.tag)+'</span></div><div class="small muted" style="margin-top:7px">'+esc(j.who)+' • '+new Date(j.when).toLocaleString("fr-FR")+'</div></div>').join("")}function render(){renderHome();renderInbox();renderOllama();renderJournal();fillProjects()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("main>section").forEach(s=>s.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden")});saveCapture.onclick=async()=>{let t=captureText.value.trim();if(!t){toast("Écris ou dicte une note.");return}let item={id:uid(),project:captureProject.value||null,type:"CAPTURE",title:t.slice(0,80),priority:capturePriority.value,status:"À TRAITER",created:Date.now(),text:t};state.inbox.unshift(item);log("Capture ajoutée — "+t.slice(0,50));captureText.value="";save();if(!CORE)await detectCore();if(CORE){try{let r=await coreChat(t,"auto");item.status="TRAITÉ";log("Capture transmise à BAZOR — "+t.slice(0,50));save();toast(r?"Envoyé à BAZOR ✓":"Capture enregistrée")}catch(e){toast("Conservé dans Inbox — relais indisponible")}}else toast("PC absent : conservé dans Inbox")};clearCapture.onclick=()=>captureText.value="";micBtn.onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Dictée indisponible dans ce navigateur.");return}let r=new SR();r.lang="fr-FR";r.onresult=e=>{captureText.value+=(captureText.value?" ":"")+e.results[0][0].transcript;toast("Dictée ajoutée")};r.onerror=()=>toast("La dictée n'a pas démarré.");r.start()};if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js");render();detectCore();setInterval(detectCore,15000);</script></body></html>
