<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>BAZOR COMMAND CENTER</title><style>
:root{--bg:#15171c;--panel:#20232a;--panel2:#292d36;--text:#f5f7fa;--muted:#aab1bd;--accent:#29a8ff;--ok:#45d483;--warn:#f2c94c;--bad:#ff6b6b;--line:#383d48}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding-bottom:90px}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#332713,#15171c 72%);border-bottom:1px solid var(--line);padding:14px 16px}.brand{font-weight:900;letter-spacing:.04em}.sub{font-size:12px;color:var(--muted);margin-top:4px}main{max-width:760px;margin:auto;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.ok{background:#173d2b;color:var(--ok)}.todo{background:#403718;color:var(--warn)}.blocked{background:#472226;color:var(--bad)}button,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 14px;font-weight:800;position:relative;transition:transform .08s ease,box-shadow .12s ease,filter .12s ease}
button:active{transform:scale(.96);filter:brightness(1.18)}
button.tap-confirm{transform:scale(.96);box-shadow:0 0 0 3px rgba(69,212,131,.45),0 0 18px rgba(41,168,255,.45);filter:brightness(1.2)}
button.tap-confirm::after{content:"✓";position:absolute;right:7px;top:5px;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:999px;background:var(--ok);color:#07150d;font-size:12px;font-weight:1000;box-shadow:0 0 10px rgba(69,212,131,.55)}
button:disabled{opacity:.65;cursor:wait}
.primary{background:var(--accent);color:#21190b}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#4a2328;color:#ffd3d3}.wide{width:100%}textarea,select{width:100%;background:#17191e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:120px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.progress{height:9px;background:#111318;border-radius:999px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--accent)}nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#121419ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}nav .tabs{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}nav button{background:transparent;color:var(--muted);padding:9px 4px;font-size:11px}nav button.active{background:var(--panel2);color:var(--accent)}h2,h3{margin:0 0 8px}h2{font-size:19px}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:12px 0}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#101216;color:#fff;padding:11px 14px;border-radius:12px;border:1px solid var(--line);z-index:20;display:none;max-width:90%}
</style></head><body><header><div class="row"><div><div class="brand">BAZOR COMMAND CENTER</div><div class="sub">Mobile • BAZOR Core • Ollama</div></div><span id="pcStatus" class="badge todo" onclick="detectCore()" style="cursor:pointer" title="Toucher pour retester">CONNEXION…</span></div></header><main><section id="home"></section><section id="capture" class="hidden"><div class="card"><h2>BAZOR CAPTURE</h2><div class="muted small">Transforme une idée rapide en tâche.</div><label>Note</label><textarea id="captureText" placeholder="Ex. Ajouter une fonction dans AI Room…"></textarea><div class="row wrap"><button class="secondary grow" id="micBtn">🎙️ Dicter</button><button class="secondary grow" id="clearCapture">Effacer</button></div><label>Projet</label><select id="captureProject"></select><label>Priorité</label><select id="capturePriority"><option>NORMALE</option><option>BASSE</option><option>HAUTE</option><option>URGENTE</option></select><div style="height:10px"></div><button class="primary wide" id="saveCapture">ENVOYER DANS L'INBOX</button></div></section><section id="inbox" class="hidden"></section><section id="ollama" class="hidden"></section><section id="journal" class="hidden"></section></main><div class="toast" id="toast"></div><nav><div class="tabs"><button data-tab="home" class="active">⌂<br>Accueil</button><button data-tab="capture">✎<br>Capture</button><button data-tab="inbox">☰<br>Inbox</button><button data-tab="ollama">◉<br>Ollama</button><button data-tab="journal">≡<br>Journal</button></div></nav><script>
const APP_BUILD="2026.09.18-auto7";const CORE_PORT=8775;
let buildCheckBusy=false;
async function fetchTimeout(url,opts={},ms=2500){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opts,signal:c.signal})}finally{clearTimeout(t)}}
async function checkBuild(){if(buildCheckBusy)return;buildCheckBusy=true;try{const r=await fetchTimeout("./index.html?buildcheck="+Date.now(),{cache:"no-store"},3000);const t=await r.text();const m=t.match(/const APP_BUILD="([^"]+)"/);if(m&&m[1]!==APP_BUILD){location.reload()}}catch(e){}finally{buildCheckBusy=false}}
let CORE=null,coreChecking=false;
async function detectCore(){if(coreChecking)return null;coreChecking=true;pcStatus.textContent="CONNEXION…";pcStatus.className="badge todo";const hosts=[location.hostname];if(location.hostname==="127.0.0.1"||location.hostname==="localhost")hosts.push("127.0.0.1");try{for(const h of hosts){if(!h||h==="github.com")continue;try{const base="http://"+h+":"+CORE_PORT;const r=await fetchTimeout(base+"/api/v1/health",{cache:"no-store"},2500);if(r.ok){const d=await r.json();CORE=base;pcStatus.textContent=d.ollama?.online?"PC + OLLAMA OK":"PC OK / OLLAMA HS";pcStatus.className="badge "+(d.ollama?.online?"ok":"todo");return d}}catch(e){}}CORE=null;pcStatus.textContent="CORE NON JOIGNABLE";pcStatus.className="badge blocked";return null}finally{coreChecking=false}}async function coreChat(text,target="ollama"){if(!CORE)await detectCore();if(!CORE)throw new Error("core_unreachable");const r=await fetch(CORE+"/api/v1/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,target,room:"BAZOR MOBILE"})});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}let actionBusy={};
function answerText(data){
  if(data==null)return "Réponse reçue";
  if(typeof data==="string")return data;
  const candidates=[
    data?.result?.answer,
    data?.ollama?.answer,
    data?.mammouth?.answer,
    data?.answer,
    data?.response,
    data?.message
  ];
  for(const v of candidates)if(typeof v==="string"&&v.trim())return v;
  try{return JSON.stringify(data,null,2)}catch(e){return String(data)}
}
function showResult(title,data){
  let old=document.getElementById("bazorResult");if(old)old.remove();
  let e=document.createElement("div");e.id="bazorResult";e.className="card";
  e.style="position:fixed;left:12px;right:12px;bottom:82px;z-index:9999;max-height:52vh;overflow:auto";
  const body=answerText(data);
  const meta=[data?.status,data?.result?.provider||data?.ollama?.provider||data?.mammouth?.provider,data?.result?.model||data?.ollama?.model||data?.mammouth?.model].filter(Boolean).join(" • ");
  e.innerHTML='<div class="row"><h3>'+esc(title)+'</h3><button class="secondary" onclick="this.closest(\'#bazorResult\').remove()">Fermer</button></div>'+(meta?'<div class="small muted" style="margin-top:6px">'+esc(meta)+'</div>':'')+'<div style="white-space:pre-wrap;margin-top:10px">'+esc(body||"Réponse reçue")+'</div>';
  document.body.appendChild(e)
}
const SUBPROJECTS={
"ai-room":[
 {id:"mobile",name:"BAZOR Mobile / Command Center",next:"Fiabiliser le pilotage des outils BAZOR depuis le mobile"},
 {id:"core",name:"BAZOR Core / routage IA",next:"Fiabiliser le routage Ollama / Mammouth et les retours structurés"},
 {id:"watcher",name:"GitHub Watcher / Auto-update",next:"Contrôler les mises à jour automatiques et le redémarrage des composants"},
 {id:"history",name:"Historique des sessions",next:"Brancher l'historique réel des sessions BAZOR"},
 {id:"logs",name:"Logs / diagnostic automatique",next:"Centraliser blocages, logs et propositions de correction"}
],
"simple-studio":[
 {id:"comfy",name:"ComfyUI / bridge",next:"Fiabiliser la connexion Studio ↔ ComfyUI"},
 {id:"presets",name:"Presets & modèles locaux",next:"Lire les vrais presets et modèles installés puis les exposer au Studio"},
 {id:"h3",name:"MiniMax H3 / workflows",next:"Valider le workflow H3 8 Go VRAM et ses dépendances réelles"},
 {id:"quality",name:"Analyse & correction automatique",next:"Analyser les générations puis proposer/corriger automatiquement"},
 {id:"gallery",name:"Galerie / sécurité",next:"Fiabiliser galerie, suppression et masquage"}
],
"wii-relay":[
 {id:"bridge",name:"Wii AI Bridge",next:"Fiabiliser le pont GitHub ↔ PC ↔ Ollama"},
 {id:"game",name:"Prototype jeu Wii / PC",next:"Poursuivre le prototype jouable minimal"},
 {id:"maze",name:"Labyrinthes / chunks",next:"Structurer labyrinthes, chunks et contraintes mémoire Wii"},
 {id:"multi",name:"Multijoueur",next:"Préparer 2 joueurs écran partagé puis extension 4 joueurs"}
],
"modo-viewer":[
 {id:"live",name:"Modération TikTok Live",next:"Fiabiliser le flux de modération et le tri"},
 {id:"profiles",name:"Profils / notes privées",next:"Fiabiliser profils, notes et historique local"},
 {id:"translate",name:"Traduction / lecture vocale",next:"Fiabiliser traduction arabe et lecture vocale"},
 {id:"touch",name:"Interface tactile / zoom",next:"Corriger le zoom tactile et l'ergonomie mobile"}
]
};
const KEY="bazor.command.center.mobile.v1",uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const seed={projects:[{id:"ai-room",name:"BAZOR AI Room",status:"A_FAIRE",progress:62,next:"Brancher l'historique des sessions"},{id:"simple-studio",name:"AI Simple Studio",status:"OK",progress:88,next:"Relire les presets de génération"},{id:"wii-relay",name:"Projet Wii AI Relay",status:"BLOQUE",progress:34,next:"Tester le pont quand le PC est disponible"},{id:"modo-viewer",name:"MODO Viewer",status:"A_FAIRE",progress:45,next:"Corriger le zoom tactile"}],inbox:[],jobs:[{id:"j1",label:"Résumer les notes AI Room",model:"mistral:latest",status:"EN ATTENTE"},{id:"j2",label:"Analyser les logs Wii",model:"qwen2.5-coder:7b",status:"PC HORS LIGNE"}],journal:[{id:"l1",what:"Initialisation BAZOR Mobile",tag:"OK",when:Date.now(),who:"BAZOR"}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){state=structuredClone(seed)}const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1700)}function log(what,tag="OK"){state.journal.unshift({id:uid(),what,tag,when:Date.now(),who:"Vincent"})}function pname(id){return state.projects.find(p=>p.id===id)?.name||"Général"}function scl(s){return s==="OK"?"ok":s==="A_FAIRE"?"todo":"blocked"}function subFor(id){return SUBPROJECTS[id]||[]}
function treeOpenKey(id){return "bazor.tree."+id}
function rememberTree(id,open){localStorage.setItem(treeOpenKey(id),open?"1":"0")}
async function goSubProject(parentId,subId){
  const p=state.projects.find(x=>x.id===parentId), sub=subFor(parentId).find(x=>x.id===subId);
  if(!p||!sub)return;
  const key="sub:"+parentId+":"+subId;
  if(actionBusy[key]){toast("Action déjà en cours…");return}
  actionBusy[key]=true;toast("Envoi du sous-projet à BAZOR…");
  try{
    const r=await coreChat("Projet: "+p.name+"\nSous-projet: "+sub.name+"\nAction: "+sub.next+"\nTravaille à partir du contexte réel disponible. N'invente pas de résultat exécuté.","auto");
    log("Sous-projet traité — "+sub.name);save();showResult(sub.name,r);toast("Réponse reçue ✓")
  }catch(e){
    log("Sous-projet en attente — "+sub.name,"BLOQUÉ");save();toast("Relais indisponible")
  }finally{setTimeout(()=>delete actionBusy[key],1200)}
}
function projectTreeCard(p){
  const children=subFor(p.id);
  const open=localStorage.getItem(treeOpenKey(p.id))!=="0";
  return '<details class="card" '+(open?'open':'')+' ontoggle="rememberTree(\''+p.id+'\',this.open)">'+
    '<summary style="cursor:pointer;list-style:none"><div class="row"><div><h2 style="margin:0">'+esc(p.name)+'</h2><div class="small muted">'+children.length+' sous-projet'+(children.length>1?'s':'')+'</div></div><span class="badge '+scl(p.status)+'">'+(p.status==="A_FAIRE"?"À FAIRE":p.status)+'</span></div>'+
    '<div class="progress" style="margin-top:10px"><div style="width:'+p.progress+'%"></div></div><div class="small muted">Progression '+p.progress+'% • toucher pour '+(open?'replier':'déployer')+'</div></summary>'+
    '<div style="margin-top:14px;padding-left:10px;border-left:2px solid rgba(41,168,255,.35)">'+
      children.map((c,i)=>'<div style="padding:10px 0;'+(i?'border-top:1px solid rgba(255,255,255,.08)':'')+'"><div class="row"><strong>'+esc(c.name)+'</strong><span class="badge todo">SOUS-PROJET</span></div><div class="small muted" style="margin:6px 0 9px">'+esc(c.next)+'</div><button class="secondary" onclick="event.preventDefault();event.stopPropagation();goSubProject(\''+p.id+'\',\''+c.id+'\')">GO SOUS-PROJET</button></div>').join('')+
    '</div><hr><div class="small muted">PROCHAINE ACTION PROJET</div><div style="margin:5px 0 12px">'+esc(p.next)+'</div><div class="row"><button class="primary grow" onclick="event.preventDefault();event.stopPropagation();goProject(\''+p.id+'\')">GO</button><button class="secondary grow" onclick="event.preventDefault();event.stopPropagation();goAuto(\''+p.id+'\')">GO AUTO</button></div></details>'
}
function renderHome(){
  const totalSubs=state.projects.reduce((n,p)=>n+subFor(p.id).length,0);
  home.innerHTML='<div class="card"><h2>Arborescence BAZOR</h2><div class="small muted">'+state.projects.length+' projets • '+totalSubs+' sous-projets • toucher un projet pour déployer/replier</div></div>'+state.projects.map(projectTreeCard).join("")
}async function goProject(id){if(actionBusy[id]){toast("Action déjà en cours…");return}actionBusy[id]=true;let p=state.projects.find(x=>x.id===id);toast("Envoi à BAZOR…");try{let r=await coreChat("Projet: "+p.name+"\nAction: "+p.next,"ollama");log("GO exécuté — "+p.name);save();showResult("Ollama — "+p.name,r);toast("Réponse reçue ✓")}catch(e){log("GO en attente relais — "+p.name,"BLOQUÉ");save();toast("PC non joignable — conserver dans Inbox")}finally{setTimeout(()=>delete actionBusy[id],1200)}}async function goAuto(id){let key="auto:"+id;if(actionBusy[key]){toast("GO AUTO déjà en cours…");return}actionBusy[key]=true;let p=state.projects.find(x=>x.id===id);try{if(!CORE)await detectCore();if(!CORE){state.inbox.unshift({id:uid(),project:id,type:"GO AUTO",title:p.next,priority:"HAUTE",status:"À TRAITER",created:Date.now()});log("GO AUTO mis en attente — "+p.name,"BLOQUÉ");save();toast("PC absent : tâche conservée");return}const r=await fetch(CORE+"/api/v1/go",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project_id:id,task:p.next,room:"BAZOR MOBILE",files:[],current_progress:p.progress})});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(d.project){p.status=d.project.status||p.status;p.progress=d.project.progress??p.progress;p.next=d.project.next||p.next}log("GO AUTO exécuté — "+p.name);save();showResult("GO AUTO — "+p.name,d);toast(d.ok?"GO AUTO terminé ✓":"Réponse reçue")}catch(e){log("GO AUTO bloqué — "+p.name,"BLOQUÉ");save();toast("Blocage GO AUTO — journalisé")}finally{setTimeout(()=>delete actionBusy[key],1200)}}function fillProjects(){captureProject.innerHTML='<option value="">Automatique / Général</option>'+state.projects.map(p=>'<optgroup label="'+esc(p.name)+'"><option value="'+p.id+'">'+esc(p.name)+' — projet</option>'+subFor(p.id).map(c=>'<option value="'+p.id+'">'+esc('↳ '+c.name)+'</option>').join('')+'</optgroup>').join("")}function renderInbox(){inbox.innerHTML='<div class="card"><h2>INBOX</h2><div class="small muted">'+state.inbox.filter(x=>x.status==="À TRAITER").length+' à traiter</div></div>'+state.inbox.map(i=>'<div class="card"><span class="badge todo">'+esc(i.type)+'</span><h3 style="margin-top:10px">'+esc(i.title)+'</h3><div class="small muted">'+esc(pname(i.project))+' • '+esc(i.priority)+' • '+esc(i.status)+'</div><div class="row" style="margin-top:12px"><button class="secondary grow" onclick="treat(\''+i.id+'\')">Traiter</button><button class="danger" onclick="delInbox(\''+i.id+'\')">Suppr.</button></div></div>').join("")}function treat(id){let i=state.inbox.find(x=>x.id===id);i.status="TRAITÉ";log("Inbox traitée — "+i.title);save();toast("Marqué traité")}function delInbox(id){let i=state.inbox.find(x=>x.id===id);if(confirm("Supprimer cet élément ?")){state.inbox=state.inbox.filter(x=>x.id!==id);log("Inbox supprimée — "+i.title,"AMÉLIORATION");save()}}function renderOllama(){ollama.innerHTML='<div class="card"><h2>OLLAMA</h2><div class="small muted">Ollama reste local et protégé derrière BAZOR Core.</div></div>'+state.jobs.map(j=>'<div class="card"><div class="row"><h3>'+esc(j.label)+'</h3><span class="badge '+(j.status==="PC HORS LIGNE"?"blocked":"todo")+'">'+esc(j.status)+'</span></div><div class="small muted">'+esc(j.model)+' • '+(CORE?'RELAIS RÉEL':'EN ATTENTE')+'</div></div>').join("")}function renderJournal(){journal.innerHTML='<div class="card"><h2>JOURNAL</h2><div class="small muted">Traçabilité locale</div></div>'+state.journal.map(j=>'<div class="card"><div class="row"><strong>'+esc(j.what)+'</strong><span class="badge '+(j.tag==="OK"?"ok":j.tag==="BLOQUÉ"?"blocked":"todo")+'">'+esc(j.tag)+'</span></div><div class="small muted" style="margin-top:7px">'+esc(j.who)+' • '+new Date(j.when).toLocaleString("fr-FR")+'</div></div>').join("")}function render(){renderHome();renderInbox();renderOllama();renderJournal();fillProjects()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("main>section").forEach(s=>s.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden")});saveCapture.onclick=async()=>{let t=captureText.value.trim();if(!t){toast("Écris ou dicte une note.");return}let item={id:uid(),project:captureProject.value||null,type:"CAPTURE",title:t.slice(0,80),priority:capturePriority.value,status:"À TRAITER",created:Date.now(),text:t};state.inbox.unshift(item);log("Capture ajoutée — "+t.slice(0,50));captureText.value="";save();if(!CORE)await detectCore();if(CORE){try{let r=await coreChat(t,"auto");item.status="TRAITÉ";log("Capture transmise à BAZOR — "+t.slice(0,50));save();toast(r?"Envoyé à BAZOR ✓":"Capture enregistrée")}catch(e){toast("Conservé dans Inbox — relais indisponible")}}else toast("PC absent : conservé dans Inbox")};clearCapture.onclick=()=>captureText.value="";micBtn.onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Dictée indisponible dans ce navigateur.");return}let r=new SR();r.lang="fr-FR";r.onresult=e=>{captureText.value+=(captureText.value?" ":"")+e.results[0][0].transcript;toast("Dictée ajoutée")};r.onerror=()=>toast("La dictée n'a pas démarré.");r.start()};document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  b.classList.remove("tap-confirm");
  void b.offsetWidth;
  b.classList.add("tap-confirm");
  if(navigator.vibrate)navigator.vibrate(18);
  setTimeout(()=>b.classList.remove("tap-confirm"),360);
},true);
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js");render();detectCore();setInterval(detectCore,15000);setInterval(checkBuild,15000);</script></body></html>
