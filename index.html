*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

button.primary{background:var(--accent);color:#07131c;border-color:transparent}button:active{transform:scale(.95);filter:brightness(1.15)}button.tap-confirm{box-shadow:0 0 0 2px rgba(66,212,131,.45)}button.tap-confirm::after{content:"✓";position:absolute;right:3px;top:2px;background:var(--ok);color:#07150d;border-radius:999px;font-size:9px;width:15px;height:15px;display:grid;place-items:center}
.detail{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.subrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #2a3039}.subrow:last-child{border-bottom:0}.subname{font-size:13px;font-weight:750}.submeta{font-size:10px;color:var(--muted);margin-top:3px}.subgo{padding:7px 9px;min-width:44px}

textarea,select{width:100%;background:#15191f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}textarea{min-height:100px}
label{display:block;font-size:11px;color:var(--muted);margin:9px 0 5px}.wide{width:100%}.hidden{display:none!important}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#101319f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.tabs button{background:transparent;border:0;color:var(--muted);padding:7px 2px}.tabs button.active{background:#202630;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:50;background:#0c1015;border:1px solid var(--line);padding:9px 11px;border-radius:10px;display:none;max-width:92%;font-size:12px}
.modal{position:fixed;left:10px;right:10px;bottom:74px;z-index:60;max-height:60vh;overflow:auto;background:#171c23;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 18px 60px #0008}
.security-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.security-line{font-size:11px;padding:7px;border-radius:9px;background:#12161c;border:1px solid var(--line)}

<script>
const APP_BUILD="2026.09.18-auto27",CORE_PORT=8775,KEY="bazor.command.center.mobile.v2";
let CORE=null,REGISTRY={projects:[]},syncTimer=null,actionBusy={},state={projects:[],subprojects:{},runs:{},info:{},expanded:{},inbox:[],journal:[]};
const SECURITY_KEY="bazor.security.device.v1";
const BIOMETRIC_KEY="bazor.biometric.cred.v1";
let SEC_DEVICE=null,SEC_STATUS=null;

function frenchOnly(v){return String(v??"").replace(/[\u0400-\u04FF]+/g,"[texte non français masqué]")}
const esc=s=>frenchOnly(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));

function sha256ascii(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  const maxWord=Math.pow(2,32),words=[],len=ascii.length*8;
  let hash=sha256ascii.h=sha256ascii.h||[],k=sha256ascii.k=sha256ascii.k||[],pc=k.length,n=2;
  while(pc<64){let prime=true;for(let f=2;f*f<=n;f++)if(n%f===0){prime=false;break}if(prime){if(pc<8)hash[pc]=(Math.pow(n,.5)*maxWord)|0;k[pc++]=(Math.pow(n,1/3)*maxWord)|0}n++}
  ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
  for(let i=0;i<ascii.length;i++){let j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=(len/maxWord)|0;words[words.length]=len;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16),oldHash=hash.slice(0);hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0,a,hash[1],hash[2],(hash[3]+temp1)|0,e,hash[5],hash[6]];
    }
    for(let i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  let out="";for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;out+=(b<16?"0":"")+b.toString(16)}return out;
}
function deviceId(){
  let id=localStorage.getItem("bazor.device.id");
  if(!id){id="mob-"+uid()+"-"+Math.random().toString(36).slice(2);localStorage.setItem("bazor.device.id",id)}
  return id;
}
function loadSecurityDevice(){try{SEC_DEVICE=JSON.parse(localStorage.getItem(SECURITY_KEY)||"null")}catch(e){SEC_DEVICE=null}}
function b64url(bytes){let s="";for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const raw=atob(s),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a}
function usbLocalMode(){return location.hostname==="127.0.0.1"||location.hostname==="localhost"}
function biometricAvailable(){return !!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials)}
function biometricConfigured(){return !!localStorage.getItem(BIOMETRIC_KEY)}
async function enableBiometric(){
  if(!biometricAvailable())throw new Error("La biométrie Chrome exige HTTPS ou une future APK BAZOR.");
  const challenge=crypto.getRandomValues(new Uint8Array(32)),uidb=crypto.getRandomValues(new Uint8Array(16));
  const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:"BAZOR"},user:{id:uidb,name:"BAZOR Mobile",displayName:"BAZOR Mobile"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000,attestation:"none"}});
  if(!cred)throw new Error("Biométrie annulée");
  localStorage.setItem(BIOMETRIC_KEY,JSON.stringify({id:b64url(cred.rawId),created:Date.now()}));
  toast("Empreinte/biométrie activée sur ce téléphone ✓");
}
async function verifyBiometric(){
  if(!biometricConfigured())return true;
  if(!biometricAvailable())throw new Error("Biométrie indisponible ici : HTTPS ou APK requis.");
  const saved=JSON.parse(localStorage.getItem(BIOMETRIC_KEY));
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  const cred=await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{type:"public-key",id:unb64url(saved.id),transports:["internal"]}],userVerification:"required",timeout:60000}});
  return !!cred;
}

function autoRequestPairCodeOnce(){
  try{
    if(sessionStorage.getItem("bazor.pair.auto.once")==="1")return;
    sessionStorage.setItem("bazor.pair.auto.once","1");
  }catch(_){}
  setTimeout(()=>requestPairCode().catch?.(()=>{}),250);
}
async function securityStatus(){
  if(!CORE)return null;
  try{
    const r=await fetchTimeout(CORE+"/api/v1/security/status?device_id="+encodeURIComponent(deviceId()),{cache:"no-store"},2500);
    SEC_STATUS=await r.json();
    if(!SEC_DEVICE){securityBadge.textContent="🔒 À APPAIRER";securityBadge.className="badge todo";return SEC_STATUS}
    try{
      const d=await signedFetch("/api/v1/security/device",{method:"GET"},3000);
      if(d.ok){securityBadge.textContent="🔒 TEL OK";securityBadge.className="badge ok"}else throw 0;
    }catch(e){securityBadge.textContent="🔒 À RÉAPPAIRER";securityBadge.className="badge blocked"}
    return SEC_STATUS;
  }catch(e){
    if(SEC_DEVICE&&lastCoreOk&&Date.now()-lastCoreOk<90000){
      securityBadge.textContent="🔒 TEL OK";securityBadge.className="badge ok";
      return SEC_STATUS;
    }
    securityBadge.textContent="🔒 ?";securityBadge.className="badge blocked";return null
  }
}
async function signedFetch(path,opts={},ms=5000){
  if(!SEC_DEVICE?.secret)throw new Error("Téléphone non appairé");
  const retrySafe=!!opts.bazorRetrySafe||String(opts.method||"GET").toUpperCase()==="GET";
  const cleanOpts=Object.assign({},opts);delete cleanOpts.bazorRetrySafe;
  const tries=retrySafe?4:1;
  let lastErr=null;
  for(let attempt=1;attempt<=tries;attempt++){
    try{
      if(!CORE)await detectCore();if(!CORE)throw new Error("Core non joignable");
      const ch=await fetchTimeout(CORE+"/api/v1/security/challenge?device_id="+encodeURIComponent(SEC_DEVICE.device_id),{cache:"no-store"},3000);
      if(!ch.ok)throw new Error("Challenge indisponible");
      const cj=await ch.json();if(!cj.ok)throw new Error("Appareil non reconnu");
      const proof=sha256ascii(cj.nonce+"|"+SEC_DEVICE.device_id+"|"+SEC_DEVICE.secret);
      const headers=Object.assign({},cleanOpts.headers||{},{"X-BAZOR-DEVICE":SEC_DEVICE.device_id,"X-BAZOR-NONCE":cj.nonce,"X-BAZOR-PROOF":proof});
      const r=await fetchTimeout(CORE+path,Object.assign({},cleanOpts,{headers}),ms);
      const data=await r.json().catch(()=>({ok:false,error:"invalid_json"}));
      if(r.status===401){securityBadge.textContent="🔒 BLOQUÉ";securityBadge.className="badge blocked";throw new Error("Authentification refusée")}
      if(!r.ok&&r.status>=500)throw new Error("Core HTTP "+r.status);
      return data;
    }catch(e){
      lastErr=e;
      if(!retrySafe||/Authentification refusée|Téléphone non appairé|Appareil non reconnu/.test(String(e.message||"")))throw e;
      // Une micro-coupure ne doit pas faire tomber visuellement la liaison.
      // On garde le Core courant pendant les retries et on ne bascule en
      // reconnexion qu’après plusieurs échecs réels.
      if(attempt>=3){
        pcStatus.textContent="RÉSEAU INSTABLE…";pcStatus.className="badge todo";
        providerStatus.textContent="Nouvelle tentative automatique";
      }
      await new Promise(r=>setTimeout(r,Math.min(2200,350*attempt*attempt)));
    }
  }
  throw lastErr||new Error("Core non joignable");
}
async function requestPairCode(){
  if(!CORE)await detectCore();
  if(!CORE){toast("Core indisponible — BAZOR tente de le relancer");return false}
  try{
    const r=await fetchTimeout(CORE+"/api/v1/security/pairing-request?device_id="+encodeURIComponent(deviceId()),{cache:"no-store"},2500);
    const d=await r.json();
    if(d.ok){toast(d.printed?"Code envoyé au Hub PC ✓":"Code déjà actif sur le Hub PC");return true}
  }catch(e){}
  toast("Impossible de demander le code pour l'instant");return false
}
async function consumePairingQr(){
  let code="";
  try{
    const m=String(location.hash||"").match(/^#pair=([A-Z0-9-]{14})$/i);
    if(!m)return false;
    code=decodeURIComponent(m[1]).toUpperCase();
    history.replaceState(null,"",location.pathname+location.search);
  }catch(_){return false}
  try{
    await pairPhone(code);
    toast("QR appairage validé ✓");
    if(biometricAvailable()&&!biometricConfigured()){
      try{await enableBiometric()}catch(_){toast("TEL OK • biométrie à activer ensuite")}
    }
    return true;
  }catch(e){
    toast("QR d’appairage refusé ou expiré");
    return false;
  }
}
async function pairPhone(code){
  if(!CORE)await detectCore();if(!CORE)throw new Error("Core non joignable");
  const clean=String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(clean))throw new Error("Code incomplet");
  const r=await fetchTimeout(CORE+"/api/v1/security/pair",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:clean,device_id:deviceId(),device_name:"BAZOR Mobile Android"})},5000);
  const d=await r.json();if(!r.ok||!d.ok)throw new Error("Code refusé ou expiré");
  SEC_DEVICE={device_id:d.device_id,secret:d.secret,name:d.name};
  localStorage.setItem(SECURITY_KEY,JSON.stringify(SEC_DEVICE));
  const st=await securityStatus();
  if(!securityBadge.textContent.includes("TEL OK"))throw new Error("Appairage enregistré mais contrôle de preuve non validé");
  return d;
}
async function openSecurity(){
  await securityStatus();
  document.getElementById("securityModal")?.remove();
  const e=document.createElement("div");e.id="securityModal";e.className="modal";
  if(!SEC_DEVICE||securityBadge.textContent.includes("APPAIRER")){
    e.innerHTML='<div class="row between"><h3>BAZOR Security Tool</h3><button onclick="this.closest(\'#securityModal\').remove()">Fermer</button></div><div class="infobox">Le code est affiché <b>uniquement sur le PC</b>. Appuie une seule fois sur le bouton ci-dessous, puis saisis ce même code. Il ne sera plus remplacé automatiquement.</div><button class="wide" style="margin-top:8px" onclick="requestPairCode()">AFFICHER UN NOUVEAU CODE SUR LE PC</button><label>Code du PC</label><input id="pairCode" class="security-code wide" placeholder="XXXX-XXXX-XXXX" maxlength="14" style="background:#15191f;color:white;border:1px solid var(--line);border-radius:10px;padding:10px"><button class="primary wide" style="margin-top:9px" onclick="pairPhone(pairCode.value).then(async()=>{toast(\'Téléphone authentifié ✓\');if(biometricAvailable()&&!biometricConfigured()){try{await enableBiometric()}catch(_){toast(\'TEL OK • biométrie à activer ensuite\')}}document.getElementById(\'securityModal\')?.remove()}).catch(x=>toast(x.message))">APPAIRER CE TÉLÉPHONE</button><div class="mini muted" style="margin-top:8px">VPN accepté : l’adresse IP n’est pas ta preuve d’identité. C’est l’appareil appairé qui compte.</div>';
  }else{
    let alerts=[],approvals=[],dev=null;
    try{dev=(await signedFetch("/api/v1/security/device",{method:"GET"},3000)).device}catch(_){}
    try{alerts=(await signedFetch("/api/v1/security/alerts?limit=8",{method:"GET"},3000)).alerts||[]}catch(_){}
    try{approvals=(await signedFetch("/api/v1/security/approvals",{method:"GET"},3000)).approvals||[]}catch(_){}
    const suspicious=alerts.filter(a=>a.event==="SECURITY_ALERT");
    e.innerHTML='<div class="row between"><h3>BAZOR Security Tool</h3><button onclick="this.closest(\'#securityModal\').remove()">Fermer</button></div><div class="security-grid"><div class="security-line">📱 Appareil<br><b>'+esc(dev?.name||SEC_DEVICE.name||"Mobile")+'</b></div><div class="security-line">🔐 Authentification<br><b>VALIDÉE</b></div><div class="security-line">🌐 Réseau/VPN<br><b>IP non utilisée comme identité</b></div><div class="security-line">🚨 Alertes douteuses<br><b>'+suspicious.length+'</b></div></div>'+
      '<div class="infobox"><b>Empreinte / biométrie</b><div class="mini" style="margin-top:5px">'+(biometricConfigured()?'✅ Activée sur cet appareil':biometricAvailable()?'Disponible — activation recommandée':'Utilise de préférence le mode USB BAZOR (127.0.0.1) : Chrome le traite comme contexte local sécurisé pour activer la biométrie.')+'</div>'+(!biometricConfigured()&&biometricAvailable()?'<button class="primary wide" style="margin-top:7px" onclick="enableBiometric().then(openSecurity).catch(x=>toast(x.message))">ACTIVER EMPREINTE</button>':'')+'</div>'+      '<button class="primary wide" style="margin-top:8px" onclick="updateRestartBazor()">↻ MISE À JOUR + RELANCER BAZOR</button>'+'<div class="infobox"><b>Autorisations en attente : '+approvals.length+'</b>'+approvals.map(a=>'<div style="margin-top:7px">'+esc(a.action)+'<div class="row" style="margin-top:5px"><button class="primary grow" onclick="securityDecision(\''+a.id+'\',\'APPROVE\')">AUTORISER</button><button class="grow" onclick="securityDecision(\''+a.id+'\',\'DENY\')">REFUSER</button></div></div>').join("")+'</div>'+
      (suspicious.length?'<div class="infobox"><b>Alertes récentes</b>'+suspicious.slice(0,5).map(a=>'<div class="mini" style="margin-top:5px">⚠ '+esc(a.reason)+' • '+esc(a.ip||"")+'</div>').join("")+'</div>':'<div class="infobox">✅ Aucun doute de sécurité récent détecté.</div>')+
      '<div class="mini muted">La clé de l’appareil reste masquée. Elle n’est jamais envoyée dans les requêtes normales : BAZOR utilise une preuve temporaire à usage unique.</div>';
  }
  document.body.appendChild(e);
}
async function securityDecision(id,decision){try{if(biometricConfigured())await verifyBiometric();const d=await signedFetch("/api/v1/security/approval/decide",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,decision})},4000);toast(d.ok?"Décision enregistrée":"Décision impossible");openSecurity()}catch(e){toast(e.message)}}
async function updateRestartBazor(){
  try{
    if(!SEC_DEVICE?.secret)throw new Error("Appaire d’abord le téléphone");
    if(biometricConfigured())await verifyBiometric();
    toast("Mise à jour + relance BAZOR…");
    const d=await signedFetch("/api/v1/system/update-restart",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"},5000);
    if(!d.ok)throw new Error(d.error||"Relance impossible");
    toast("Commande envoyée ✓ BAZOR va se relancer");
  }catch(e){toast(e.message)}
}

const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

let coreMisses=0,lastCoreOk=0,coreProbePromise=null;
async function detectCore(){
  if(coreProbePromise)return coreProbePromise;
  coreProbePromise=detectCoreOnce();
  try{return await coreProbePromise}finally{coreProbePromise=null}
}
async function detectCoreOnce(){
  const candidates=[];
  const origin=location.origin;
  if(/^https?:\/\//.test(origin))candidates.push(origin);
  const direct="http://"+location.hostname+":"+CORE_PORT;
  if(!candidates.includes(direct))candidates.push(direct);
  if(location.hostname!=="127.0.0.1"&&!candidates.includes("http://127.0.0.1:"+CORE_PORT))candidates.push("http://127.0.0.1:"+CORE_PORT);

  // Pendant un simple contrôle périodique, conserver l’état OK affiché.
  if(!lastCoreOk){pcStatus.textContent="CONNEXION…";pcStatus.className="badge todo"}
  for(let attempt=1;attempt<=3;attempt++){
    for(const base of candidates){
      try{
        const sr=await fetchTimeout(base+"/api/v1/security/status?device_id="+encodeURIComponent(deviceId()),{cache:"no-store"},1800);
        if(!sr.ok)continue;
        CORE=base;coreMisses=0;lastCoreOk=Date.now();
        try{
          const r=await fetchTimeout(base+"/api/v1/health",{cache:"no-store"},3500);
          if(r.ok){
            const d=await r.json();
            pcStatus.textContent=d.ollama?.online?"PC + OLLAMA OK":"PC OK / OLLAMA HS";
            pcStatus.className="badge "+(d.ollama?.online?"ok":"todo");
            const mam=d.mammouth||{};
            providerStatus.textContent=(base===origin?"Gateway OK • ":"")+"Ollama "+(d.ollama?.online?"OK":"HS")+" • Mammouth "+(mam.configured?"OK":"NON CONFIGURÉ");
            return d;
          }
        }catch(_){}
        pcStatus.textContent="PC + CORE OK";pcStatus.className="badge ok";
        providerStatus.textContent=(base===origin?"Gateway connecté":"Core connecté")+" • vérification des moteurs…";
        return {ok:true,ollama:{online:false},mammouth:{}};
      }catch(e){}
    }
    await new Promise(r=>setTimeout(r,350*attempt));
  }
  coreMisses++;
  // Tolérance aux micro-coupures Wi-Fi : ne déclarer le téléphone hors ligne
  // qu’après plusieurs contrôles consécutifs ratés ou une absence prolongée.
  if(lastCoreOk && Date.now()-lastCoreOk<90000 && coreMisses<4){
    pcStatus.textContent="PC + CORE OK";pcStatus.className="badge ok";
    providerStatus.textContent="Liaison conservée • micro-coupure absorbée";
  }else{
    CORE=null;pcStatus.textContent="CORE NON JOIGNABLE";pcStatus.className="badge blocked";providerStatus.textContent="Gateway/Core indisponible";
  }
  return null;
}

let transportRecoveryBusy=false;
function isTransportFailureText(v){
  return /failed to fetch|core non joignable|reconnexion|networkerror|load failed|connexion interrompue|core http 50[234]|core_gateway_unreachable|aborterror|the operation was aborted/i.test(String(v||""));

async function recoverTransientFetchBlocks(){
  if(transportRecoveryBusy||!CORE||!REGISTRY?.projects?.length)return;
  transportRecoveryBusy=true;
  try{
    const done=JSON.parse(sessionStorage.getItem(KEY+".transport-recovery."+APP_BUILD)||"{}");
    const todo=[];
    for(const p of state.projects||[]){
      const r=state.runs?.[p.id];
      const candidateIds=new Set();
      if(r?.subId&&isTransportFailureText(r.stage))candidateIds.add(r.subId);
      for(const c of children(p.id)){
        const x=sp(p.id,c.id);
        if(x.status==="BLOQUE"&&isTransportFailureText(x.summary))candidateIds.add(c.id);
      }
      for(const sid of candidateIds){
        const k=p.id+":"+sid;
        const x=sp(p.id,sid);
        x.status="A_EVALUER";
        x.summary="Connexion rétablie • reprise automatique";
        x.updated=Date.now();
        if(p.status==="BLOQUE")p.status="A_FAIRE";
        if(r?.subId===sid){
          state.runs[p.id]={active:false,blocked:false,subId:sid,stage:"Connexion rétablie • reprise automatique",taskProgress:0,checkpoints:[{text:"Liaison Core rétablie",kind:"ok"}]};
        }
        if(!done[k]){
          done[k]=Date.now();
          todo.push([p.id,sid]);
        }
      }
    }
    sessionStorage.setItem(KEY+".transport-recovery."+APP_BUILD,JSON.stringify(done));
    if(todo.length){
      localSave();
      toast("Connexion rétablie • reprise automatique");
      for(const [pid,sid] of todo){
        if(!CORE)break;
        await goSub(pid,sid,true);
      }
    }
  }finally{
    transportRecoveryBusy=false;
  }
}

async function taskCall(pid,c,repair=false,previous=""){
  if(!CORE)await detectCore();if(!CORE)throw new Error("Core non joignable");
  const x=sp(pid,c.id),requestId="mob-"+pid+"-"+c.id+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  const payload={project_id:pid,subproject_name:c.name,task:"Réponds uniquement en français. "+(x.next||c.next),current_progress:x.progress??0,repair,previous,provider:providerMode.value,request_id:requestId,async:true,apply_actions:true};
  let start=await signedFetch("/api/v1/task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),bazorRetrySafe:true},8000);
  if(start.job_state==="done"||start.job_state==="error")return start.result||start;
  const deadline=Date.now()+6*60*1000;
  let misses=0;
  while(Date.now()<deadline){
    await new Promise(r=>setTimeout(r,1400));
    try{
      const s=await signedFetch("/api/v1/task/status?id="+encodeURIComponent(requestId),{method:"GET",cache:"no-store",bazorRetrySafe:true},5000);
      misses=0;
      if(s.job_state==="done"||s.job_state==="error")return s.result||s;
      const run=state.runs[pid];
      if(run?.active){run.stage="Calcul en arrière-plan • mobile reconnectable";run.taskProgress=Math.max(run.taskProgress||25,45);render()}
    }catch(e){
      misses++;
      const run=state.runs[pid];
      if(run?.active){run.stage="Reconnexion au Core ("+misses+")";run.taskProgress=Math.max(run.taskProgress||25,45);render()}
      if(misses>=12)throw new Error("Core non joignable après reconnexion automatique");
    }
  }
  throw new Error("Analyse trop longue (>6 min)");
}

function showResult(title,d){document.getElementById("resultModal")?.remove();const e=document.createElement("div");e.id="resultModal";e.className="modal";const body=d?.answer||d?.result?.answer||d?.ollama?.answer||d?.mammouth?.answer||JSON.stringify(d,null,2);const ex=d?.execution;const ar=ex?.action_result||{};const files=ar.files||[];const tests=ar.tests||[];const fileList=files.map(f=>'<div class="mini">✓ '+esc((f.root||"")+" : "+(f.path||""))+'</div>').join("");const evidence=ex?'<div class="infobox"><b>'+(ex.mode==="file_changes"?"✅ TRAVAIL RÉEL PROUVÉ":"ℹ ANALYSE SEULE — RIEN MODIFIÉ")+'</b><div class="mini muted" style="margin-top:4px">'+(files.length?files.length+" fichier(s) modifié(s) • "+tests.filter(t=>t.ok).length+"/"+tests.length+" test(s) OK":"Aucun fichier modifié")+'</div>'+fileList+'</div>':"";e.innerHTML='<div class="row between"><h3>'+esc(title)+'</h3><button onclick="this.closest(\'#resultModal\').remove()">Fermer</button></div><div class="mini muted">'+esc([d?.status,d?.engine,d?.model].filter(Boolean).join(" • "))+'</div>'+evidence+'<div style="white-space:pre-wrap;font-size:12px;margin-top:8px">'+esc(body)+'</div>';document.body.appendChild(e)}
function fillProjects(){captureProject.innerHTML='<option value="">Général</option>'+(REGISTRY.projects||[]).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")}
function renderInbox(){inbox.innerHTML='<div class="card"><h2>Inbox</h2><div class="mini muted">'+state.inbox.length+' élément(s)</div></div>'+state.inbox.map(i=>'<div class="card"><b>'+esc(i.title)+'</b><div class="mini muted">'+esc(i.priority||"")+' • '+esc(i.status||"")+'</div></div>').join("")}
function renderIA(){ollama.innerHTML='<div class="card"><h2>Moteurs IA</h2><div class="project-phrase">'+esc(providerStatus.textContent)+'</div><div class="mini muted">AUTO privilégie le local et peut utiliser Mammouth pour les tâches adaptées. Tu peux forcer OLLAMA ou MAMMOUTH avec le sélecteur en haut.</div></div>'}
function renderJournal(){journal.innerHTML='<div class="card"><h2>Journal</h2></div>'+state.journal.slice(0,80).map(j=>'<div class="card"><div class="row between"><b class="mini">'+esc(j.what)+'</b><span class="badge '+statusClass(j.tag==="BLOQUÉ"?"BLOQUE":"OK")+'">'+esc(j.tag)+'</span></div><div class="mini muted">'+new Date(j.when).toLocaleString("fr-FR")+'</div></div>').join("")}
function render(){renderHome();renderInbox();renderIA();renderJournal();fillProjects()}

saveCapture.onclick=()=>{const t=captureText.value.trim();if(!t)return toast("Écris une note");state.inbox.unshift({id:uid(),title:t.slice(0,90),text:t,project:captureProject.value||null,priority:capturePriority.value,status:"À TRAITER",when:Date.now()});captureText.value="";log("Capture ajoutée");localSave();toast("Ajouté à l'Inbox")}
providerMode.value=localStorage.getItem("bazor.provider")||"auto";providerMode.onchange=()=>{localStorage.setItem("bazor.provider",providerMode.value);toast("Moteur : "+providerMode.options[providerMode.selectedIndex].text)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden")})
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;b.classList.add("tap-confirm");if(navigator.vibrate)navigator.vibrate(14);setTimeout(()=>b.classList.remove("tap-confirm"),280)},true)
pcStatus.onclick=async()=>{await detectCore();await securityStatus();render()}
securityBadge.onclick=openSecurity;
loadSecurityDevice();
const toastEl=document.getElementById("toast");
(async()=>{await detectCore();await consumePairingQr();await securityStatus();await loadRegistry();if(SEC_DEVICE)await pullState();await recoverTransientFetchBlocks();render();setInterval(async()=>{await detectCore();if(CORE){await securityStatus();await recoverTransientFetchBlocks()}render()},CORE?20000:5000);setInterval(async()=>{try{const r=await fetch("./index.html?b="+Date.now(),{cache:"no-store"}),t=await r.text(),m=t.match(/APP_BUILD="([^"]+)"/);if(m&&m[1]!==APP_BUILD)location.reload()}catch(e){}},15000)})();
