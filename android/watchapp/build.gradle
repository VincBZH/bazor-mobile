plugins { id 'com.android.application' }

android {
    namespace 'com.bazor.watch'
    compileSdk 35

    defaultConfig {
        applicationId "com.bazor.montre"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.3.1"
    }

    signingConfigs {
        stable {
            storeFile file("bazor-watch.keystore")
            storePassword "bazor123"
            keyAlias "bazorwatch"
            keyPassword "bazor123"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }
}

dependencies {}
