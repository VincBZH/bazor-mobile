plugins { id 'com.android.application' }

android {
    namespace 'com.bazor.watch'
    compileSdk 35

    defaultConfig {
        applicationId "com.bazor.watch"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.1.1"
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {}
