plugins { id 'com.android.application' }

android {
    namespace 'com.bazor.watch'
    compileSdk 35

    defaultConfig {
        applicationId "com.bazor.montre"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.3.0"
    }

    signingConfigs {
        stable {
            storeFile file("bazor-watch.keystore")
            storePassword "REMOVED_BAZOR_LEGACY_PASSWORD"
            keyAlias "bazorwatch"
            keyPassword "REMOVED_BAZOR_LEGACY_PASSWORD"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }
}

dependencies {}
